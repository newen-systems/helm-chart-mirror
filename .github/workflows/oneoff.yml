name: oneoff
on: pull_request
permissions:
  packages: write
jobs:
  repush:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set -eu
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u newen-systems --password-stdin
          helm repo add js https://charts.jetstack.io
          helm pull js/cert-manager --version v1.21.3 --prov
          up=$(yq -r '.entries["cert-manager"][] | select(.version == "v1.21.3") | .digest' ~/.cache/helm/repository/js-index.yaml)
          echo "$up  cert-manager-v1.21.3.tgz" | sha256sum -c -
          helm push cert-manager-v1.21.3.tgz oci://ghcr.io/newen-systems/charts
        env:
          GH_TOKEN: ${{ github.token }}
