# rook-ceph chart 1.21.2 (tag 1.21.2, no "v" from 1.21): every image from the work registry.
# Replace REGISTRY with the work Quay prefix (for example quay.example.com/team).
# Tags and the list come from rook/rook deploy/examples/images.txt at v1.21.2.
# csi-snapshot-metadata (registry.k8s.io, mirrored) has no chart key; it is only
# deployed when the snapshot metadata feature is enabled.
image:
  repository: REGISTRY/rook/ceph
  tag: v1.21.2
ceph-csi-operator:
  controllerManager:
    manager:
      image:
        repository: REGISTRY/cephcsi/ceph-csi-operator
        tag: v1.1.0
csi:
  cephcsi:     {repository: REGISTRY/cephcsi/cephcsi, tag: v3.18.1}
  registrar:   {repository: REGISTRY/sig-storage/csi-node-driver-registrar, tag: v2.18.0}
  provisioner: {repository: REGISTRY/sig-storage/csi-provisioner, tag: v6.3.0}
  snapshotter: {repository: REGISTRY/sig-storage/csi-snapshotter, tag: v8.6.0}
  attacher:    {repository: REGISTRY/sig-storage/csi-attacher, tag: v4.13.0}
  resizer:     {repository: REGISTRY/sig-storage/csi-resizer, tag: v2.2.1}
  csiAddons:   {repository: REGISTRY/csiaddons/k8s-sidecar, tag: v0.15.1}
